name: Feature request
description: Suggest an improvement to SmoothScroll.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Issues are public. Describe the user need without sharing confidential information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task or frustration behind the idea.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, tokens, and personal information from this request and its attachments.
          required: true
