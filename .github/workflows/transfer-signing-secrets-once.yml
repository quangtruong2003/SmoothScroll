name: Transfer updater signing secrets once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy old updater signing secrets to the private repository
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SECRET_TRANSFER_TOKEN }}
          OLD_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OLD_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$OLD_PRIVATE_KEY"
          test -n "$OLD_PRIVATE_KEY_PASSWORD"
          printf '%s' "$OLD_PRIVATE_KEY" | gh secret set TAURI_SIGNING_PRIVATE_KEY_OLD --repo quangtruong2003/Smooth-Scroll-Private
          printf '%s' "$OLD_PRIVATE_KEY_PASSWORD" | gh secret set TAURI_SIGNING_PRIVATE_KEY_OLD_PASSWORD --repo quangtruong2003/Smooth-Scroll-Private
