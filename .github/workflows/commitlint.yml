name: Lint Commit Messages

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch to validate for required PR checks
        required: true
        type: string

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate commits in PR
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            git fetch --no-tags origin master:refs/remotes/origin/master
            FROM="origin/master"
            TO="HEAD"
          fi

          pnpm exec commitlint --from "$FROM" --to "$TO" --verbose
